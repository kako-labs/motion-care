<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>종료 후</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020A16}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1280px; box-sizing: border-box; padding: 18px 32px 26px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; word-break: keep-all; color: #EAF4FF; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: radial-gradient(1100px 620px at 82% 4%, #0B447F 0%, rgba(11,68,127,0) 62%), radial-gradient(900px 620px at 4% 58%, #07365F 0%, rgba(7,54,95,0) 60%), radial-gradient(1000px 480px at 60% 104%, #06396B 0%, rgba(6,57,107,0) 62%), #030E1F">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; flex: none; font-size: 22px; color: #C6DAF0">
    <div style="display: flex; align-items: center; gap: 28px">
      <span style="font-size: 26px; font-weight: 700; color: #F4FAFF">오전 8:50</span>
      <span style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: rgba(0,170,210,0.22); border: 1.5px solid rgba(90,210,240,0.55); font-size: 22px; font-weight: 800; color: #9BE8FB">P</span>
      <span>주행 가능 <b style="font-weight: 700; color: #F4FAFF">428 km</b></span>
    </div>
    <span style="display: flex; align-items: center; height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 20px; background: rgba(255,190,140,0.16); border: 1.5px solid rgba(255,200,160,0.5); font-size: 21px; font-weight: 700; color: #FFD3B3">합성 주행</span>
  </div>

  <section style="position: relative; overflow: hidden; display: flex; flex-direction: column; flex: none; height: 556px; box-sizing: border-box; padding: 38px 44px; border-radius: 32px; border: 1.5px solid rgba(156,205,255,0.30); box-shadow: 0 26px 60px rgba(0,6,20,0.6), inset 0 1.5px 0 rgba(255,255,255,0.20); background: linear-gradient(120deg, #06264C 0%, #04193A 55%, #03122B 100%)">
    <img src="/_blob/53b555997199fb0c449876c15ae67d0a" alt="" style="position: absolute; top: -130px; right: -40px; width: 1200px; height: auto; -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0) 12%, #000 46%); mask-image: linear-gradient(90deg, rgba(0,0,0,0) 12%, #000 46%)">
    <div style="position: relative; display: flex; flex-direction: column; height: 100%; width: 860px">
      <span style="align-self: flex-start; display: flex; align-items: center; gap: 10px; height: 46px; box-sizing: border-box; padding: 0 20px 0 16px; border-radius: 23px; background: rgba(0,170,210,0.20); border: 1.5px solid rgba(90,210,240,0.55); font-size: 23px; font-weight: 700; color: #A9EDFC">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#7FE6FB"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"></path></svg>
        이번 운행 요약
      </span>
      <div style="display: flex; gap: 56px; margin-top: 20px">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 24px; color: #B9D2EC">주행 시간</span>
          <span style="font-size: 92px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(180deg, #FFFFFF 26%, #A7DDF7 100%); -webkit-background-clip: text; background-clip: text; color: transparent">38<span style="font-size: 38px; letter-spacing: 0; margin-left: 6px">분</span></span>
        </span>
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 24px; color: #B9D2EC">이동 거리</span>
          <span style="font-size: 92px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(180deg, #FFFFFF 26%, #A7DDF7 100%); -webkit-background-clip: text; background-clip: text; color: transparent">21.4<span style="font-size: 38px; letter-spacing: 0; margin-left: 6px">km</span></span>
        </span>
      </div>
      <span style="margin-top: auto; font-size: 24px; color: #B9D2EC">다음 운행에서 해볼 행동</span>
      <h1 style="margin: 6px 0 0; font-size: 58px; line-height: 1.16; font-weight: 800; letter-spacing: -0.025em; color: #FFFFFF; text-shadow: 0 4px 30px rgba(0,20,50,0.7)">정지 지점보다<br>조금 일찍 감속해보세요</h1>
    </div>
  </section>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 560px 1fr; gap: 14px">
    <section style="display: flex; flex-direction: column; box-sizing: border-box; padding: 30px 32px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); min-height: 0">
      <h2 style="margin: 0; font-size: 28px; font-weight: 800">가장 많이 관찰된 패턴</h2>
      <p style="margin: 18px 0 0; font-size: 40px; line-height: 1.2; font-weight: 800; color: #FFFFFF">정차 직전 속도 변화<br>5회</p>
      <div style="display: flex; align-items: center; gap: 16px; height: 84px; box-sizing: border-box; margin-top: 20px; padding: 0 20px 0 16px; border-radius: 20px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.26)">
        <svg aria-hidden="true" width="130" height="44" viewBox="0 0 170 48" fill="none" style="flex: none; filter: drop-shadow(0 0 6px rgba(0,190,235,0.9))"><path d="M2 24 L12 8 L20 40 L30 4 L40 44 L50 12 L60 36 L72 16 L84 30 L98 20 L112 27 L128 23 L148 24 L168 24" stroke="#5FE0FB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-size: 23px; line-height: 1.35; color: #DCEBFA">직전 3회 평균은 7회였어요</span>
      </div>
      <a href="TripDetail2.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 88px; flex: none; box-sizing: border-box; border-radius: 22px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.36); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); font-size: 28px; font-weight: 800">자세히 보기</a>
    </section>

    <section style="display: flex; flex-direction: column; box-sizing: border-box; padding: 26px 32px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); min-height: 0">
      <div style="display: flex; align-items: center; gap: 18px">
        <img src="/_blob/4cec43282a9fc4fce1e5dae98de2900b" alt="" style="width: 84px; height: 84px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px rgba(120,220,250,0.7), 0 0 22px rgba(0,170,210,0.5)">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 22px; color: #A9C4E0">동승자 평가 · 선택</span>
          <span style="font-size: 38px; line-height: 1.15; font-weight: 800; letter-spacing: -0.015em">서아의 이번 이동은 어땠나요?</span>
        </span>
      </div>
      <div role="group" aria-label="평점" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; flex: 1; min-height: 0">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; border-radius: 24px; border: 2px solid {{o.border}}; background: {{o.bg}}; box-shadow: {{o.glow}}; color: #FFFFFF; font: inherit; font-size: 26px; font-weight: 700; cursor: pointer">
            <svg aria-hidden="true" width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="{{o.stroke}}" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M8.4 9.6h.01M15.6 9.6h.01" stroke-width="2.6"></path><path d="{{o.mouth}}"></path></svg>
            {{o.label}}
          </button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 12px; margin-top: 14px; flex: none">
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 92px; border-radius: 22px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.32); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); color: #F4FAFF; font: inherit; font-size: 24px; font-weight: 700; cursor: pointer">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>음성 남기기
        </button>
        <a href="Home2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 92px; box-sizing: border-box; border-radius: 22px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.32); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); font-size: 24px; font-weight: 700">건너뛰기</a>
        <a href="Home2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 92px; box-sizing: border-box; border-radius: 22px; background: linear-gradient(180deg, #2F9BEA 0%, #0B5FC4 100%); border: 1.5px solid rgba(170,225,255,0.65); box-shadow: 0 0 36px rgba(20,130,230,0.55), inset 0 2px 0 rgba(255,255,255,0.35); font-size: 32px; font-weight: 800; color: #FFFFFF">완료</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { picked: '조금 불편했어요' };
  renderVals() {
    const list = [
      { label: '편안했어요', mouth: 'M8 14.5c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4' },
      { label: '조금 불편했어요', mouth: 'M8.5 15.5h7' },
      { label: '많이 불편했어요', mouth: 'M8 16.8c1-1.6 2.4-2.4 4-2.4s3 .8 4 2.4' },
    ];
    return {
      options: list.map((o) => {
        const on = this.state.picked === o.label;
        return {
          ...o,
          pressed: String(on),
          pick: () => this.setState({ picked: o.label }),
          border: on ? 'rgba(170,235,255,0.85)' : 'rgba(156,205,255,0.26)',
          bg: on ? 'linear-gradient(180deg, rgba(47,155,234,0.62), rgba(11,95,196,0.62))' : 'rgba(8,28,58,0.5)',
          glow: on ? '0 0 30px rgba(20,150,235,0.55), inset 0 1.5px 0 rgba(255,255,255,0.3)' : 'none',
          stroke: on ? '#FFFFFF' : '#BFEBFC',
        };
      }),
    };
  }
}
</script>
</body>
</html>
