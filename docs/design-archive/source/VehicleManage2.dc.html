<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>차량 선택·관리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020A16}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1280px; box-sizing: border-box; padding: 18px 32px 22px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; word-break: keep-all; color: #EAF4FF; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: radial-gradient(1100px 620px at 82% 4%, #0B447F 0%, rgba(11,68,127,0) 62%), radial-gradient(900px 620px at 4% 58%, #07365F 0%, rgba(7,54,95,0) 60%), radial-gradient(1000px 480px at 60% 104%, #06396B 0%, rgba(6,57,107,0) 62%), #030E1F">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; flex: none; font-size: 22px; color: #C6DAF0">
    <div style="display: flex; align-items: center; gap: 28px">
      <span style="font-size: 26px; font-weight: 700; color: #F4FAFF">오전 8:10</span>
      <span style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: rgba(0,170,210,0.22); border: 1.5px solid rgba(90,210,240,0.55); font-size: 22px; font-weight: 800; color: #9BE8FB">P</span>
      <span>주행 가능 <b style="font-weight: 700; color: #F4FAFF">450 km</b></span>
    </div>
    <span style="font-size: 22px; font-weight: 600">5G</span>
  </div>

  <header style="display: flex; align-items: center; justify-content: space-between; height: 84px; flex: none">
    <h1 style="margin: 0; font-size: 50px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(180deg, #FFFFFF 20%, #A7DDF7 100%); -webkit-background-clip: text; background-clip: text; color: transparent">차량</h1>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 76px; box-sizing: border-box; padding: 0 28px 0 22px; border-radius: 22px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.32); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); color: #F4FAFF; font: inherit; font-size: 25px; font-weight: 700; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"></path></svg>차량 추가
    </button>
  </header>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 440px 1fr; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 14px; min-height: 0">
      <sc-for list="{{vehicles}}" as="v" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="position: relative; overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box; padding: 24px 26px; border-radius: 28px; border: 2px solid {{v.border}}; background: #05193A; box-shadow: {{v.glow}}; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
          <img src="{{v.img}}" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{v.pos}}">
          <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,14,31,0) 42%, rgba(3,14,31,0.92) 100%)"></span>
          <sc-if value="{{v.isDefault}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 18px; left: 18px; font-size: 21px; font-weight: 700; padding: 5px 14px; border-radius: 16px; background: rgba(0,170,210,0.32); border: 1.5px solid rgba(90,210,240,0.6); color: #CFF6FE">기본 차량</span>
          </sc-if>
          <span style="position: relative; font-size: 32px; font-weight: 800">{{v.name}}</span>
          <span style="position: relative; font-size: 22px; color: #C6DAF0">{{v.meta}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; min-height: 0">
      <section style="display: flex; flex-direction: column; gap: 18px; flex: none; box-sizing: border-box; padding: 26px 30px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18)">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <label for="vehicle-name" style="font-size: 24px; font-weight: 700">차량 이름</label>
          <input id="vehicle-name" type="text" value="중형 전기차" style="height: 84px; box-sizing: border-box; padding: 0 24px; border-radius: 20px; border: 1.5px solid rgba(156,205,255,0.4); background: rgba(4,18,40,0.7); box-shadow: inset 0 2px 8px rgba(0,8,24,0.6); color: #FFFFFF; font: inherit; font-size: 32px; font-weight: 700">
        </div>
        <fieldset style="margin: 0; padding: 0; border: 0">
          <legend style="padding: 0; margin-bottom: 10px; font-size: 24px; font-weight: 700">크기</legend>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{sizes}}" as="o" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 76px; border-radius: 20px; border: 2px solid {{o.border}}; background: {{o.bg}}; box-shadow: {{o.glow}}; color: #FFFFFF; font: inherit; font-size: 27px; font-weight: 700; cursor: pointer">{{o.label}}</button>
            </sc-for>
          </div>
        </fieldset>
        <fieldset style="margin: 0; padding: 0; border: 0">
          <legend style="padding: 0; margin-bottom: 10px; font-size: 24px; font-weight: 700">파워트레인</legend>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{powers}}" as="o" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 76px; border-radius: 20px; border: 2px solid {{o.border}}; background: {{o.bg}}; box-shadow: {{o.glow}}; color: #FFFFFF; font: inherit; font-size: 27px; font-weight: 700; cursor: pointer">{{o.label}}</button>
            </sc-for>
          </div>
        </fieldset>
      </section>

      <section style="flex: 1; min-height: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: 22px 30px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18)">
        <h2 style="margin: 0 0 12px; font-size: 26px; font-weight: 800">이 차량에서 받을 수 있는 정보</h2>
        <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; column-gap: 36px">
          <sc-for list="{{signals}}" as="s" hint-placeholder-count="6">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1.5px solid rgba(156,205,255,0.14)">
              <span style="font-size: 25px">{{s.label}}</span>
              <span style="flex: none; font-size: 21px; font-weight: 700; padding: 4px 14px; border-radius: 16px; background: {{s.bg}}; color: {{s.fg}}">{{s.state}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <a href="Home2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 92px; flex: none; box-sizing: border-box; border-radius: 24px; background: linear-gradient(180deg, #2F9BEA 0%, #0B5FC4 100%); border: 1.5px solid rgba(170,225,255,0.65); box-shadow: 0 0 36px rgba(20,130,230,0.55), inset 0 2px 0 rgba(255,255,255,0.35); font-size: 32px; font-weight: 800; color: #FFFFFF">이 차량으로 저장</a>
    </div>
  </div>

  <nav aria-label="주요 메뉴" style="position: relative; display: grid; grid-template-columns: 1fr 1fr 220px 1fr 1fr; align-items: center; height: 100px; flex: none; border-radius: 30px; background: linear-gradient(180deg, rgba(90,145,215,0.20), rgba(16,46,92,0.42)); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.55), inset 0 1.5px 0 rgba(255,255,255,0.18)">
    <a href="Home2.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 21px; color: #C6DAF0">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#C6DAF0"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"></path></svg>홈
    </a>
    <a href="History2.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 21px; color: #C6DAF0">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#C6DAF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>기록
    </a>
    <a href="Driving2.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; justify-self: center; width: 122px; height: 122px; margin-top: -16px; border-radius: 50%; background: radial-gradient(circle at 34% 24%, #6FD9F8 0%, #1191E2 48%, #0A4CB0 100%); border: 2px solid rgba(190,240,255,0.8); box-shadow: 0 0 0 8px rgba(0,170,210,0.16), 0 0 56px rgba(0,170,225,0.8), inset 0 2px 0 rgba(255,255,255,0.55); font-weight: 800; color: #FFFFFF">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"></path></svg><span style="font-size: 21px">운행 시작</span>
    </a>
    <a href="ProfileDetail2.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 21px; color: #C6DAF0">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#C6DAF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>프로필
    </a>
    <a href="VehicleManage2.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 21px; font-weight: 700; color: #9BE8FB">
      <svg aria-hidden="true" width="38" height="34" viewBox="0 0 34 26" fill="#9BE8FB" stroke="#9BE8FB" stroke-width="1.5" stroke-linejoin="round"><path d="M3 15l3-8c.6-1.6 1.6-3 4-3h14c2.4 0 3.4 1.4 4 3l3 8v7H3z"></path><circle cx="9" cy="17" r="1.8" fill="#0A2547"></circle><circle cx="25" cy="17" r="1.8" fill="#0A2547"></circle></svg>차량
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { vehicle: 'ev', size: '중형', power: '전기차' };
  group(key, labels) {
    return labels.map((label) => {
      const on = this.state[key] === label;
      return {
        label,
        pressed: String(on),
        pick: () => this.setState({ [key]: label }),
        border: on ? 'rgba(170,235,255,0.85)' : 'rgba(156,205,255,0.26)',
        bg: on ? 'linear-gradient(180deg, rgba(47,155,234,0.62), rgba(11,95,196,0.62))' : 'rgba(8,28,58,0.5)',
        glow: on ? '0 0 26px rgba(20,150,235,0.5), inset 0 1.5px 0 rgba(255,255,255,0.3)' : 'none',
      };
    });
  }
  renderVals() {
    const ok = { bg: 'rgba(0,170,210,0.22)', fg: '#A9EDFC' };
    const pending = { bg: 'rgba(156,205,255,0.14)', fg: '#D5E4F4' };
    const no = { bg: 'rgba(255,190,140,0.16)', fg: '#FFD3B3' };
    return {
      vehicles: [
        { id: 'ev', name: '중형 전기차', meta: '주행 12회', isDefault: true, img: '/_blob/764444c7f24c23434c770b43c49a2f0a', pos: '84% 50%' },
        { id: 'hev', name: '소형 하이브리드', meta: '주행 3회', isDefault: false, img: '/_blob/82662963fa94eafbc3ee1baa566220df', pos: '50% 50%' },
      ].map((v) => {
        const on = this.state.vehicle === v.id;
        return {
          ...v,
          pressed: String(on),
          pick: () => this.setState({ vehicle: v.id }),
          border: on ? 'rgba(170,235,255,0.85)' : 'rgba(156,205,255,0.26)',
          glow: on ? '0 0 34px rgba(20,150,235,0.55)' : '0 18px 44px rgba(0,6,20,0.5)',
        };
      }),
      sizes: this.group('size', ['소형', '중형', '대형']),
      powers: this.group('power', ['내연기관', '하이브리드', '전기차']),
      signals: [
        { label: '실내 온도', state: '제공', ...ok },
        { label: '브레이크 페달', state: '제공', ...ok },
        { label: '내기 순환', state: '제공', ...ok },
        { label: '조향각', state: '제공', ...ok },
        { label: '차량 속도', state: '확인 중', ...pending },
        { label: '실내 공기질', state: '미지원', ...no },
      ],
    };
  }
}
</script>
</body>
</html>
