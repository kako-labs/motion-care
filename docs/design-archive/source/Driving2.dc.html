<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주행 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020A16}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1280px; overflow: hidden; word-break: keep-all; color: #EAF4FF; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: #030E1F">
  <img src="/_blob/2059ab7c736404042a8ca812601e8704" alt="" style="position: absolute; left: -160px; top: 0; width: 1920px; height: 1280px; object-fit: cover">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,14,31,0.25) 0%, rgba(3,14,31,0) 40%, rgba(3,14,31,0) 62%, rgba(3,14,31,0.72) 100%)"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 18px 32px 26px; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; flex: none; font-size: 22px; color: #C6DAF0">
      <div style="display: flex; align-items: center; gap: 28px">
        <span style="font-size: 26px; font-weight: 700; color: #F4FAFF">오전 8:36</span>
        <span style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: rgba(0,170,210,0.22); border: 1.5px solid rgba(90,210,240,0.55); font-size: 22px; font-weight: 800; color: #9BE8FB">D</span>
        <span>주행 가능 <b style="font-weight: 700; color: #F4FAFF">438 km</b></span>
      </div>
      <span style="display: flex; align-items: center; height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 20px; background: rgba(255,190,140,0.16); border: 1.5px solid rgba(255,200,160,0.5); font-size: 21px; font-weight: 700; color: #FFD3B3">합성 데이터로 시연 중</span>
    </div>

    <header style="display: flex; align-items: center; gap: 18px; height: 80px; flex: none">
      <img src="/_blob/ae0818b1521fa4b61f165d9cc72fea0d" alt="" style="width: 68px; height: 68px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 28px rgba(0,170,210,0.55), 0 0 0 1.5px rgba(156,225,255,0.45)">
      <span style="font-size: 38px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(180deg, #FFFFFF 20%, #8FD4F5 100%); -webkit-background-clip: text; background-clip: text; color: transparent">모션케어</span>
      <span style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 20px; border-radius: 24px; background: rgba(0,170,210,0.24); border: 1.5px solid rgba(90,210,240,0.65); font-size: 24px; font-weight: 700; color: #BDF1FD">
        <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #5FE0FB; box-shadow: 0 0 12px #5FE0FB"></span>운행 기록 중
      </span>
    </header>

    <sc-if value="{{showBanner}}" hint-placeholder-val="{{ true }}">
      <div role="status" style="display: flex; align-items: center; gap: 20px; flex: none; height: 104px; box-sizing: border-box; padding: 0 32px; border-radius: 26px; background: linear-gradient(180deg, rgba(255,233,214,0.97), rgba(244,212,186,0.95)); box-shadow: 0 18px 44px rgba(0,8,24,0.6), 0 0 34px rgba(255,190,140,0.35); color: #0A1B33">
        <svg aria-hidden="true" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 8h16c0-2-2-3-2-8a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"></path></svg>
        <span style="font-size: 34px; font-weight: 800; letter-spacing: -0.01em">{{bannerText}}</span>
      </div>
    </sc-if>

    <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center">
      <span style="font-size: 34px; font-weight: 700; color: #C6DAF0">경과 시간</span>
      <span style="font-size: 300px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; background: linear-gradient(180deg, #FFFFFF 26%, #BFE6FA 58%, #4FB4EC 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 40px rgba(0,170,225,0.55))">24<span style="font-size: 110px; letter-spacing: 0; margin-left: 12px">분</span></span>
    </main>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; flex: none">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 18px; height: 148px; box-sizing: border-box; padding: 0 28px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.24) 0%, rgba(40,84,140,0.22) 55%, rgba(12,34,66,0.50) 100%); border: 1.5px solid rgba(156,205,255,0.34); box-shadow: 0 18px 44px rgba(0,6,20,0.55), inset 0 1.5px 0 rgba(255,255,255,0.22)">
          <span style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; flex: none; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(130,200,255,0.42), rgba(20,60,110,0.38) 60%, rgba(6,22,46,0.6)); border: 1.5px solid rgba(156,205,255,0.42); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35)">
            <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{s.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 25px; color: #C6DAF0">{{s.label}}</span>
            <span style="font-size: 54px; line-height: 1.1; font-weight: 800; white-space: nowrap; color: {{s.tone}}">{{s.value}}</span>
          </span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; flex: none; height: 112px">
      <span style="display: flex; align-items: center; gap: 14px; font-size: 26px; color: #DCEBFA">
        <span style="display: flex"><img src="/_blob/d037b8f6d888fe055acc1463e9f4069d" alt="" style="width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(120,220,250,0.7)"><img src="/_blob/4cec43282a9fc4fce1e5dae98de2900b" alt="" style="width: 60px; height: 60px; margin-left: -14px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(120,220,250,0.7)"></span>
        민준 운전 · 서아 동승 · 중형 전기차
      </span>
      <button type="button" onClick="{{askEnd}}" style="width: 400px; height: 112px; border-radius: 26px; background: linear-gradient(155deg, rgba(122,176,240,0.28), rgba(30,70,125,0.30)); border: 2px solid rgba(190,230,255,0.6); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.28), 0 14px 36px rgba(0,8,24,0.55); color: #FFFFFF; font: inherit; font-size: 36px; font-weight: 800; cursor: pointer">운행 종료</button>
    </div>
  </div>

  <sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2,8,18,0.76)">
      <div role="dialog" aria-label="운행 종료 확인" style="width: 860px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; gap: 36px; border-radius: 34px; background: linear-gradient(155deg, #123A6B 0%, #0A2547 60%, #07193A 100%); border: 1.5px solid rgba(156,205,255,0.4); box-shadow: 0 40px 90px rgba(0,4,14,0.8), inset 0 1.5px 0 rgba(255,255,255,0.24)">
        <h2 style="margin: 0; font-size: 50px; font-weight: 800; letter-spacing: -0.02em">이번 운행을 종료할까요?</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
          <button type="button" onClick="{{cancelEnd}}" style="height: 112px; border-radius: 24px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.4); color: #F4FAFF; font: inherit; font-size: 32px; font-weight: 700; cursor: pointer">계속 기록</button>
          <a href="Finished2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 112px; border-radius: 24px; background: linear-gradient(180deg, #2F9BEA 0%, #0B5FC4 100%); border: 1.5px solid rgba(170,225,255,0.65); box-shadow: 0 0 36px rgba(20,130,230,0.55), inset 0 2px 0 rgba(255,255,255,0.35); font-size: 32px; font-weight: 800; color: #FFFFFF">종료</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bannerKind":{"editor":"enum","options":["환경","장시간 주행","운전 패턴","없음"],"default":"환경","section":"주행 중 안내"},"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { confirming: false };
  renderVals() {
    const kind = this.props.bannerKind ?? '환경';
    const texts = {
      '환경': '외부 대기질이 나빠졌어요. 내기 순환을 확인해보세요',
      '장시간 주행': '1시간째 운전 중이에요. 쉬어갈 곳을 미리 정해보세요',
      '운전 패턴': '정차 직전 속도 변화가 반복되고 있어요',
    };
    return {
      showBanner: kind !== '없음',
      bannerText: texts[kind] ?? '',
      confirming: this.state.confirming,
      askEnd: () => this.setState({ confirming: true }),
      cancelEnd: () => this.setState({ confirming: false }),
      stats: [
        { label: '이동 거리', value: '12.6 km', tone: '#FFFFFF', stroke: '#BFEBFC', icon: 'M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z' },
        { label: '외부 대기질', value: '나쁨', tone: '#FFD3B3', stroke: '#FFD9BC', icon: 'M3 9h11a3 3 0 1 0-3-3M3 14h16a3 3 0 1 1-3 3M3 19h7' },
        { label: '실내 온도', value: '23.5°C', tone: '#FFFFFF', stroke: '#BFEBFC', icon: 'M14 14.5V5a2 2 0 1 0-4 0v9.5a4 4 0 1 0 4 0zM12 9v8' },
      ],
    };
  }
}
</script>
</body>
</html>
