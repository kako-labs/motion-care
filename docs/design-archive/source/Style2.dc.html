<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>색·글자·컴포넌트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020A16}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1280px; box-sizing: border-box; padding: 32px; display: grid; grid-template-columns: 780px 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 16px; overflow: hidden; word-break: keep-all; color: #EAF4FF; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: radial-gradient(1100px 620px at 82% 4%, #0B447F 0%, rgba(11,68,127,0) 62%), radial-gradient(900px 620px at 4% 58%, #07365F 0%, rgba(7,54,95,0) 60%), radial-gradient(1000px 480px at 60% 104%, #06396B 0%, rgba(6,57,107,0) 62%), #030E1F">

  <section style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; padding: 26px 30px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18)">
    <h2 style="margin: 0; font-size: 30px; font-weight: 800">색</h2>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{colors}}" as="c" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="height: 104px; border-radius: 18px; border: 1.5px solid rgba(156,205,255,0.3); background: {{c.fill}}; box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.18)"></div>
          <span style="font-size: 21px; font-weight: 700; line-height: 1.25">{{c.name}}</span>
          <span style="font-size: 20px; color: #B9D2EC">{{c.hex}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; box-sizing: border-box; padding: 26px 30px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); min-height: 0">
    <h2 style="margin: 0 0 12px; font-size: 30px; font-weight: 800">글자 · Asta Sans</h2>
    <sc-for list="{{types}}" as="t" hint-placeholder-count="7">
      <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1.5px solid rgba(156,205,255,0.14)">
        <span style="font-size: {{t.size}}px; font-weight: {{t.weight}}; line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap">{{t.sample}}</span>
        <span style="flex: none; font-size: 20px; color: #B9D2EC">{{t.spec}}</span>
      </div>
    </sc-for>
  </section>

  <section style="display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; padding: 26px 30px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); min-height: 0">
    <h2 style="margin: 0; font-size: 30px; font-weight: 800">컴포넌트</h2>
    <button type="button" style="height: 84px; flex: none; border-radius: 22px; background: linear-gradient(180deg, #2F9BEA 0%, #0B5FC4 100%); border: 1.5px solid rgba(170,225,255,0.65); box-shadow: 0 0 36px rgba(20,130,230,0.55), inset 0 2px 0 rgba(255,255,255,0.35); color: #FFFFFF; font: inherit; font-size: 28px; font-weight: 800; cursor: pointer">기본 버튼</button>
    <button type="button" style="height: 76px; flex: none; border-radius: 22px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.32); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); color: #F4FAFF; font: inherit; font-size: 26px; font-weight: 700; cursor: pointer">보조 버튼</button>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <span style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 18px 0 14px; border-radius: 22px; background: rgba(0,170,210,0.20); border: 1.5px solid rgba(90,210,240,0.55); font-size: 22px; font-weight: 700; color: #A9EDFC">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#7FE6FB"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"></path></svg>안내 칩
      </span>
      <span style="display: flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; background: rgba(255,190,140,0.16); border: 1.5px solid rgba(255,200,160,0.5); font-size: 21px; font-weight: 700; color: #FFD3B3">합성 주행</span>
      <span style="font-size: 21px; font-weight: 700; padding: 5px 14px; border-radius: 16px; background: rgba(156,205,255,0.14); color: #D5E4F4">생략</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px">
      <button type="button" aria-label="켜짐" aria-pressed="true" style="display: flex; align-items: center; justify-content: flex-end; width: 104px; height: 56px; box-sizing: border-box; padding: 5px; border: 1.5px solid rgba(170,235,255,0.7); border-radius: 28px; background: linear-gradient(180deg, #1FB4E6, #0A6FCB); box-shadow: 0 0 22px rgba(0,170,210,0.6); cursor: pointer">
        <span aria-hidden="true" style="display: block; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,20,50,0.5)"></span>
      </button>
      <button type="button" aria-label="꺼짐" aria-pressed="false" style="display: flex; align-items: center; justify-content: flex-start; width: 104px; height: 56px; box-sizing: border-box; padding: 5px; border: 1.5px solid rgba(156,205,255,0.4); border-radius: 28px; background: rgba(8,28,58,0.6); cursor: pointer">
        <span aria-hidden="true" style="display: block; width: 44px; height: 44px; border-radius: 50%; background: #93A8C2"></span>
      </button>
      <button type="button" aria-label="연결" style="display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 50%; background: rgba(120,190,250,0.14); border: 1.5px solid rgba(156,205,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); cursor: pointer">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#DDF2FF" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"></path></svg>
      </button>
      <span style="display: flex; align-items: center; justify-content: center; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(130,200,255,0.42), rgba(20,60,110,0.38) 60%, rgba(6,22,46,0.6)); border: 1.5px solid rgba(156,205,255,0.42); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35)">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#BFEBFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17.5 18z"></path></svg>
      </span>
      <svg aria-hidden="true" width="150" height="44" viewBox="0 0 170 48" fill="none" style="filter: drop-shadow(0 0 6px rgba(0,190,235,0.9))"><path d="M2 24 L12 8 L20 40 L30 4 L40 44 L50 12 L60 36 L72 16 L84 30 L98 20 L112 27 L128 23 L148 24 L168 24" stroke="#5FE0FB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <div role="status" style="display: flex; align-items: center; gap: 16px; flex: none; box-sizing: border-box; height: 92px; padding: 0 26px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,233,214,0.96), rgba(244,212,186,0.94)); box-shadow: 0 16px 40px rgba(0,8,24,0.55), 0 0 30px rgba(255,190,140,0.35); color: #0A1B33">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 8h16c0-2-2-3-2-8a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"></path></svg>
      <span style="font-size: 27px; font-weight: 800">주행 중 상단 배너</span>
    </div>
    <div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); font-size: 24px; color: #C6DAF0">유리 카드 · 모서리 28 · 안쪽 윗줄 빛</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      colors: [
        { name: '바탕', hex: '#030E1F', fill: '#030E1F' },
        { name: 'Hyundai Blue', hex: '#002C5F', fill: '#002C5F' },
        { name: '주 버튼', hex: '#0B5FC4', fill: 'linear-gradient(180deg, #2F9BEA, #0B5FC4)' },
        { name: 'Active Blue', hex: '#00AAD2', fill: '#00AAD2' },
        { name: '빛나는 강조', hex: '#5FE0FB', fill: '#5FE0FB' },
        { name: 'Light Sand', hex: '#E4DCD3', fill: '#E4DCD3' },
        { name: '주의', hex: '#FFD3B3', fill: '#FFD3B3' },
        { name: '본문 글자', hex: '#EAF4FF', fill: '#EAF4FF' },
      ],
      types: [
        { size: 68, weight: 800, sample: '오늘의 조언', spec: '히어로 · 68 · 800' },
        { size: 50, weight: 800, sample: '다음에 바꿔볼 행동', spec: '큰 제목 · 50 · 800' },
        { size: 44, weight: 800, sample: '화면 제목', spec: '화면 제목 · 44 · 800' },
        { size: 30, weight: 800, sample: '구역 제목', spec: '구역 제목 · 26~34 · 800' },
        { size: 27, weight: 500, sample: '본문과 안내 문장', spec: '본문 · 26~28' },
        { size: 23, weight: 400, sample: '보조 설명과 항목 이름', spec: '보조 · 21~24' },
        { size: 20, weight: 400, sample: '출처와 갱신 시각', spec: '최소 · 20' },
      ],
    };
  }
}
</script>
</body>
</html>
