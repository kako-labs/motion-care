<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>함께 탄 사람 연결</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020A16}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1280px; box-sizing: border-box; padding: 18px 32px 26px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; word-break: keep-all; color: #EAF4FF; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: radial-gradient(1100px 620px at 82% 4%, #0B447F 0%, rgba(11,68,127,0) 62%), radial-gradient(900px 620px at 4% 58%, #07365F 0%, rgba(7,54,95,0) 60%), radial-gradient(1000px 480px at 60% 104%, #06396B 0%, rgba(6,57,107,0) 62%), #030E1F">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; flex: none; font-size: 22px; color: #C6DAF0">
    <div style="display: flex; align-items: center; gap: 28px">
      <span style="font-size: 26px; font-weight: 700; color: #F4FAFF">오전 8:10</span>
      <span style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: rgba(0,170,210,0.22); border: 1.5px solid rgba(90,210,240,0.55); font-size: 22px; font-weight: 800; color: #9BE8FB">P</span>
      <span>주행 가능 <b style="font-weight: 700; color: #F4FAFF">450 km</b></span>
    </div>
    <span style="font-size: 22px; font-weight: 600">5G</span>
  </div>

  <header style="display: flex; align-items: center; gap: 18px; height: 88px; flex: none">
    <a href="Home2.dc.html" aria-label="닫기" style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; flex: none; border-radius: 50%; background: linear-gradient(155deg, rgba(122,176,240,0.22), rgba(30,70,125,0.18)); border: 1.5px solid rgba(156,205,255,0.36); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.25), 0 10px 26px rgba(0,8,24,0.45)">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#EAF4FF" stroke-width="2.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 44px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(180deg, #FFFFFF 20%, #A7DDF7 100%); -webkit-background-clip: text; background-clip: text; color: transparent">이 주행에 함께한 사람</h1>
      <span style="font-size: 23px; color: #B9D2EC">10월 31일 09:05 출발 · 52분 · 34.8 km</span>
    </div>
    <a href="ProfileEdit2.dc.html" style="display: flex; align-items: center; gap: 10px; height: 76px; box-sizing: border-box; padding: 0 28px 0 22px; border-radius: 22px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.32); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); font-size: 25px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"></path></svg>프로필 추가
    </a>
  </header>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
    <fieldset style="margin: 0; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; padding: 30px 32px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); min-height: 0">
      <legend style="float: left; width: 100%; padding: 0; margin-bottom: 4px; font-size: 34px; font-weight: 800">운전자 <span style="margin-left: 8px; font-size: 23px; font-weight: 500; color: #A9C4E0">한 명</span></legend>
      <sc-for list="{{drivers}}" as="d" hint-placeholder-count="2">
        <label style="display: flex; position: relative; align-items: center; gap: 20px; height: 146px; flex: none; box-sizing: border-box; padding: 0 28px 0 20px; border-radius: 24px; border: 2px solid {{d.border}}; background: {{d.bg}}; box-shadow: {{d.glow}}; cursor: pointer">
          <img src="{{d.img}}" alt="" style="width: 88px; height: 88px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px {{d.ring}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 36px; font-weight: 800">{{d.name}}</span>
            <span style="font-size: 22px; color: #C6DAF0">{{d.kind}}</span>
          </span>
          <input type="radio" name="driver" checked="{{d.selected}}" onChange="{{d.pick}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
          <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; box-sizing: border-box; border-radius: 50%; border: 2px solid {{d.mark}}; background: {{d.markBg}}">
            <sc-if value="{{d.selected}}" hint-placeholder-val="{{ false }}"><span style="display: block; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></sc-if>
          </span>
        </label>
      </sc-for>
      <div style="position: relative; overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box; padding: 20px 24px; border-radius: 24px; border: 1.5px solid rgba(156,205,255,0.22); background: #04193A">
        <img src="/_blob/53b555997199fb0c449876c15ae67d0a" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 100% 62%">
        <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(3,14,31,0.78) 0%, rgba(3,14,31,0) 52%)"></span>
        <span style="position: relative; font-size: 22px; color: #C6DAF0">연결할 주행</span>
        <span style="position: relative; font-size: 34px; font-weight: 800">52분 · 34.8 km</span>
      </div>
      <div style="flex: none; display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; padding: 18px 20px; border-radius: 18px; background: rgba(8,28,58,0.55); border: 1.5px solid rgba(156,205,255,0.18)">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8FDDF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h.01"></path></svg>
        <span style="font-size: 23px; line-height: 1.45; color: #DCEBFA">연결을 바꾸면 개인 요약과 다음 출발 안내도 함께 갱신돼요. 주행 원본 기록은 바뀌지 않아요.</span>
      </div>
    </fieldset>

    <fieldset style="margin: 0; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; padding: 30px 32px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); min-height: 0">
      <legend style="float: left; width: 100%; padding: 0; margin-bottom: 4px; font-size: 34px; font-weight: 800">동승자 <span style="margin-left: 8px; font-size: 23px; font-weight: 500; color: #A9C4E0">여러 명 선택 가능</span></legend>
      <sc-for list="{{passengers}}" as="p" hint-placeholder-count="3">
        <label style="display: flex; position: relative; align-items: center; gap: 20px; height: 146px; flex: none; box-sizing: border-box; padding: 0 28px 0 20px; border-radius: 24px; border: 2px solid {{p.border}}; background: {{p.bg}}; box-shadow: {{p.glow}}; cursor: pointer">
          <img src="{{p.img}}" alt="" style="width: 88px; height: 88px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px {{p.ring}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 36px; font-weight: 800">{{p.name}}</span>
            <span style="font-size: 22px; color: #C6DAF0">{{p.kind}}</span>
          </span>
          <input type="checkbox" checked="{{p.selected}}" onChange="{{p.flip}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
          <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; box-sizing: border-box; border-radius: 12px; border: 2px solid {{p.mark}}; background: {{p.markBg}}">
            <sc-if value="{{p.selected}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg></sc-if>
          </span>
        </label>
      </sc-for>
      <a href="ProfileEdit2.dc.html" style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; border-radius: 24px; border: 2px dashed rgba(156,205,255,0.42); background: rgba(8,28,58,0.36)">
        <span style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(130,200,255,0.42), rgba(20,60,110,0.38) 60%, rgba(6,22,46,0.6)); border: 1.5px solid rgba(156,205,255,0.42); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35)">
          <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#DDF2FF" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"></path></svg>
        </span>
        <span style="font-size: 27px; font-weight: 800">함께 타는 사람 등록</span>
        <span style="font-size: 22px; color: #B9D2EC">등록된 사람만 연결할 수 있어요</span>
      </a>
    </fieldset>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 14px; flex: none">
    <a href="Home2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 108px; box-sizing: border-box; border-radius: 26px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.36); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); font-size: 28px; font-weight: 700">인물 미지정으로 두기</a>
    <a href="Home2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 108px; box-sizing: border-box; border-radius: 26px; background: linear-gradient(180deg, #2F9BEA 0%, #0B5FC4 100%); border: 1.5px solid rgba(170,225,255,0.65); box-shadow: 0 0 36px rgba(20,130,230,0.55), inset 0 2px 0 rgba(255,255,255,0.35); font-size: 36px; font-weight: 800; color: #FFFFFF">저장</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { driver: 'minjun', passengers: { seoa: true } };
  renderVals() {
    const people = [
      { id: 'minjun', name: '민준', kind: '성인', img: '/_blob/d037b8f6d888fe055acc1463e9f4069d' },
      { id: 'jiyoung', name: '지영', kind: '성인', img: '/_blob/b9b9803b95f883f521b56d7ead990c8f' },
      { id: 'seoa', name: '서아', kind: '어린이', img: '/_blob/4cec43282a9fc4fce1e5dae98de2900b' },
      { id: 'doyun', name: '도윤', kind: '어린이', img: '/_blob/fb413833e6479ba6e3b7d29344a17f81' },
    ];
    const paint = (on) => ({
      border: on ? 'rgba(170,235,255,0.85)' : 'rgba(156,205,255,0.22)',
      bg: on ? 'linear-gradient(180deg, rgba(47,155,234,0.42), rgba(11,95,196,0.42))' : 'rgba(8,28,58,0.45)',
      glow: on ? '0 0 30px rgba(20,150,235,0.45), inset 0 1.5px 0 rgba(255,255,255,0.25)' : 'none',
      ring: on ? 'rgba(170,235,255,0.95)' : 'rgba(156,205,255,0.4)',
      mark: on ? 'rgba(190,240,255,0.95)' : 'rgba(156,205,255,0.55)',
      markBg: on ? 'linear-gradient(180deg, #1FB4E6, #0A6FCB)' : 'rgba(4,18,40,0.6)',
    });
    return {
      drivers: people.filter((p) => p.kind === '성인').map((p) => {
        const selected = this.state.driver === p.id;
        return { ...p, selected, ...paint(selected), pick: () => this.setState({ driver: p.id }) };
      }),
      passengers: people.filter((p) => p.id !== this.state.driver).map((p) => {
        const selected = !!this.state.passengers[p.id];
        return { ...p, selected, ...paint(selected), flip: () => this.setState({ passengers: { ...this.state.passengers, [p.id]: !selected } }) };
      }),
    };
  }
}
</script>
</body>
</html>
