<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메인 · 종료 후</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07111E}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1600px; height: 1280px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: #07111E; color: #F3EFE9; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 72px; flex: none">
    <div style="display: flex; align-items: center; gap: 20px">
      <span style="font-size: 40px; font-weight: 800; letter-spacing: -0.01em">모션케어</span>
      <span style="font-size: 20px; font-weight: 600; padding: 6px 14px; border: 2px solid #24405F; border-radius: 4px; color: #B9C4D2">운행 종료</span>
    </div>
    <span style="font-size: 20px; font-weight: 600; padding: 6px 14px; border: 2px solid #8A6A52; border-radius: 4px; color: #E4DCD3">합성 주행</span>
  </header>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 860px 636px; gap: 24px">
    <section style="display: flex; flex-direction: column; box-sizing: border-box; padding: 44px; background: #002C5F; border-radius: 6px; min-height: 0">
      <h1 style="margin: 0; font-size: 40px; font-weight: 800">이번 운행 요약</h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 36px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 26px; color: #B9C4D2">주행 시간</span>
          <span style="font-size: 96px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">38<span style="font-size: 40px; font-weight: 700; margin-left: 8px; letter-spacing: 0">분</span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 26px; color: #B9C4D2">이동 거리</span>
          <span style="font-size: 96px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">21.4<span style="font-size: 40px; font-weight: 700; margin-left: 8px; letter-spacing: 0">km</span></span>
        </div>
      </div>
      <div aria-hidden="true" style="display: flex; gap: 4px; height: 4px; margin-top: 36px">
        <div style="width: 120px; background: #00AAD2"></div>
        <div style="flex: 1; background: #2F5A8C"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 32px">
        <span style="font-size: 26px; color: #B9C4D2">가장 많이 관찰된 패턴</span>
        <span style="font-size: 40px; font-weight: 800; line-height: 1.3">정차 직전 속도 변화 5회</span>
        <span style="font-size: 26px; line-height: 1.45; color: #D5DCE5">같은 운전자·차량의 직전 3회 평균은 7회였어요.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 36px">
        <span style="font-size: 26px; color: #B9C4D2">다음 운행에서 해볼 행동</span>
        <span style="font-size: 40px; font-weight: 800; line-height: 1.3">정지 지점보다 조금 일찍 감속해보세요</span>
      </div>
      <a href="TripDetail.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 96px; flex: none; box-sizing: border-box; border: 3px solid #6FD6EE; border-radius: 6px; font-size: 30px; font-weight: 800; color: #F3EFE9">자세히 보기</a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; padding: 40px; background: #0D1C2F; border-radius: 6px; min-height: 0">
      <span style="font-size: 26px; color: #93A3B5">동승자 평가 · 선택</span>
      <h2 style="margin: 0; font-size: 48px; line-height: 1.25; font-weight: 800">서아의 이번 이동은 어땠나요?</h2>
      <div role="group" aria-label="평점" style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; height: 112px; box-sizing: border-box; padding: 0 32px; border: 3px solid {{o.border}}; border-radius: 6px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 32px; font-weight: 700; cursor: pointer">
            {{o.label}}
            <sc-if value="{{o.selected}}" hint-placeholder-val="{{ false }}">
              <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"><path d="M4 12l6 6L20 6"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 80px; flex: none; border: 2px solid #3A5C82; border-radius: 6px; background: transparent; color: #D5DCE5; font: inherit; font-size: 26px; font-weight: 600; cursor: pointer">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        음성으로 남기기
      </button>
      <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; flex: none">
        <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 112px; box-sizing: border-box; border: 3px solid #3A5C82; border-radius: 6px; font-size: 30px; font-weight: 700; color: #D5DCE5">건너뛰기</a>
        <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 112px; border-radius: 6px; background: #00AAD2; color: #04121F; font-size: 36px; font-weight: 800">완료</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { picked: '조금 불편했어요' };
  renderVals() {
    const labels = ['편안했어요', '조금 불편했어요', '많이 불편했어요'];
    return {
      options: labels.map((label) => {
        const selected = this.state.picked === label;
        return {
          label, selected,
          pressed: String(selected),
          pick: () => this.setState({ picked: label }),
          border: selected ? '#00AAD2' : '#3A5C82',
          bg: selected ? '#00AAD2' : 'transparent',
          fg: selected ? '#04121F' : '#F3EFE9',
        };
      }),
    };
  }
}
</script>
</body>
</html>
