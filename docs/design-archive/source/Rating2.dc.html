<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동승자 평가</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020A16}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1280px; box-sizing: border-box; padding: 18px 32px 26px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; word-break: keep-all; color: #EAF4FF; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: radial-gradient(1100px 620px at 82% 4%, #0B447F 0%, rgba(11,68,127,0) 62%), radial-gradient(900px 620px at 4% 58%, #07365F 0%, rgba(7,54,95,0) 60%), radial-gradient(1000px 480px at 60% 104%, #06396B 0%, rgba(6,57,107,0) 62%), #030E1F">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; flex: none; font-size: 22px; color: #C6DAF0">
    <div style="display: flex; align-items: center; gap: 28px">
      <span style="font-size: 26px; font-weight: 700; color: #F4FAFF">오전 8:52</span>
      <span style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: rgba(0,170,210,0.22); border: 1.5px solid rgba(90,210,240,0.55); font-size: 22px; font-weight: 800; color: #9BE8FB">P</span>
      <span>주행 가능 <b style="font-weight: 700; color: #F4FAFF">428 km</b></span>
    </div>
    <span style="font-size: 22px; font-weight: 600">5G</span>
  </div>

  <header style="display: flex; align-items: center; gap: 18px; height: 88px; flex: none">
    <a href="TripDetail2.dc.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; flex: none; border-radius: 50%; background: linear-gradient(155deg, rgba(122,176,240,0.22), rgba(30,70,125,0.18)); border: 1.5px solid rgba(156,205,255,0.36); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.25), 0 10px 26px rgba(0,8,24,0.45)">
      <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#EAF4FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 44px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(180deg, #FFFFFF 20%, #A7DDF7 100%); -webkit-background-clip: text; background-clip: text; color: transparent">동승자 평가</h1>
      <span style="font-size: 23px; color: #B9D2EC">11월 2일 08:12 출발 · 민준 운전</span>
    </div>
    <div role="group" aria-label="평가 대상" style="display: flex; gap: 10px">
      <sc-for list="{{targets}}" as="t" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 12px; height: 84px; box-sizing: border-box; padding: 0 24px 0 10px; border-radius: 42px; border: 2px solid {{t.border}}; background: {{t.bg}}; box-shadow: {{t.glow}}; color: #FFFFFF; font: inherit; cursor: pointer">
          <img src="{{t.img}}" alt="" style="width: 62px; height: 62px; border-radius: 50%">
          <span style="display: flex; flex-direction: column; align-items: flex-start">
            <span style="font-size: 26px; font-weight: 800">{{t.name}}</span>
            <span style="font-size: 20px; color: #C6DAF0">{{t.state}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 900px 1fr; gap: 14px">
    <section style="position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; padding: 34px 38px; border-radius: 30px; border: 1.5px solid rgba(156,205,255,0.30); box-shadow: 0 26px 60px rgba(0,6,20,0.6), inset 0 1.5px 0 rgba(255,255,255,0.20); background: linear-gradient(130deg, #06264C 0%, #04193A 60%, #03122B 100%); min-height: 0">
      <h2 style="margin: 0; font-size: 50px; line-height: 1.18; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF">서아의 이번 이동은 어땠나요?</h2>
      <div role="group" aria-label="평점" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; margin-top: 24px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 1; min-height: 0; display: flex; align-items: center; gap: 24px; box-sizing: border-box; padding: 0 32px; border-radius: 26px; border: 2px solid {{o.border}}; background: {{o.bg}}; box-shadow: {{o.glow}}; color: #FFFFFF; font: inherit; font-size: 38px; font-weight: 800; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="{{o.stroke}}" stroke-width="1.5" stroke-linecap="round" style="flex: none"><circle cx="12" cy="12" r="9.5"></circle><path d="M8.4 9.6h.01M15.6 9.6h.01" stroke-width="2.6"></path><path d="{{o.mouth}}"></path></svg>
            <span style="flex: 1">{{o.label}}</span>
            <sc-if value="{{o.selected}}" hint-placeholder-val="{{ false }}">
              <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 18px; flex: none">
        <span style="font-size: 24px; color: #C6DAF0; white-space: nowrap">누가 답하고 있나요?</span>
        <div role="group" aria-label="응답자" style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{responders}}" as="r" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="height: 76px; border-radius: 20px; border: 2px solid {{r.border}}; background: {{r.bg}}; color: #FFFFFF; font: inherit; font-size: 25px; font-weight: 700; cursor: pointer">{{r.label}}</button>
          </sc-for>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; box-sizing: border-box; padding: 30px 30px; border-radius: 28px; background: linear-gradient(155deg, rgba(122,176,240,0.16) 0%, rgba(40,84,140,0.10) 55%, rgba(12,34,66,0.30) 100%); border: 1.5px solid rgba(156,205,255,0.26); box-shadow: 0 18px 44px rgba(0,6,20,0.5), inset 0 1.5px 0 rgba(255,255,255,0.18); min-height: 0">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 32px; font-weight: 800">무엇이 가장 불편했나요?</h2>
        <span style="font-size: 22px; color: #A9C4E0">선택</span>
      </div>
      <div role="group" aria-label="불편 항목" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; margin-top: 18px">
        <sc-for list="{{causes}}" as="c" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="flex: 1; min-height: 0; display: flex; align-items: center; gap: 16px; box-sizing: border-box; padding: 0 22px; border-radius: 22px; border: 2px solid {{c.border}}; background: {{c.bg}}; box-shadow: {{c.glow}}; color: #FFFFFF; font: inherit; font-size: 28px; font-weight: 700; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#BFEBFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="{{c.icon}}"></path></svg>
            {{c.label}}
          </button>
        </sc-for>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 84px; flex: none; margin-top: 16px; border-radius: 22px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.36); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); color: #F4FAFF; font: inherit; font-size: 26px; font-weight: 700; cursor: pointer">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>음성으로 남기기
      </button>
    </section>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 14px; flex: none">
    <a href="TripDetail2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 108px; box-sizing: border-box; border-radius: 26px; background: linear-gradient(155deg, rgba(122,176,240,0.18), rgba(30,70,125,0.14)); border: 1.5px solid rgba(156,205,255,0.36); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.2); font-size: 30px; font-weight: 700">건너뛰기</a>
    <a href="TripDetail2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 108px; box-sizing: border-box; border-radius: 26px; background: linear-gradient(180deg, #2F9BEA 0%, #0B5FC4 100%); border: 1.5px solid rgba(170,225,255,0.65); box-shadow: 0 0 36px rgba(20,130,230,0.55), inset 0 2px 0 rgba(255,255,255,0.35); font-size: 36px; font-weight: 800; color: #FFFFFF">저장</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { rating: '조금 불편했어요', cause: '출발·정차', target: 'seoa', responder: '서아 본인' };
  renderVals() {
    const paint = (on) => ({
      border: on ? 'rgba(170,235,255,0.85)' : 'rgba(156,205,255,0.24)',
      bg: on ? 'linear-gradient(180deg, rgba(47,155,234,0.62), rgba(11,95,196,0.62))' : 'rgba(8,28,58,0.5)',
      glow: on ? '0 0 30px rgba(20,150,235,0.5), inset 0 1.5px 0 rgba(255,255,255,0.3)' : 'none',
    });
    return {
      targets: [
        { id: 'seoa', name: '서아', state: '작성 중', img: '/_blob/4cec43282a9fc4fce1e5dae98de2900b' },
        { id: 'doyun', name: '도윤', state: '미응답', img: '/_blob/fb413833e6479ba6e3b7d29344a17f81' },
      ].map((t) => {
        const on = this.state.target === t.id;
        return { ...t, ...paint(on), pressed: String(on), pick: () => this.setState({ target: t.id }) };
      }),
      options: [
        { label: '편안했어요', mouth: 'M8 14.5c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4' },
        { label: '조금 불편했어요', mouth: 'M8.5 15.5h7' },
        { label: '많이 불편했어요', mouth: 'M8 16.8c1-1.6 2.4-2.4 4-2.4s3 .8 4 2.4' },
      ].map((o) => {
        const on = this.state.rating === o.label;
        return { ...o, ...paint(on), selected: on, stroke: on ? '#FFFFFF' : '#BFEBFC', pressed: String(on), pick: () => this.setState({ rating: o.label }) };
      }),
      responders: ['서아 본인', '다른 사람이 대신'].map((label) => {
        const on = this.state.responder === label;
        return { label, ...paint(on), pressed: String(on), pick: () => this.setState({ responder: label }) };
      }),
      causes: [
        { label: '출발·정차', icon: 'M4 12h12M12 6l6 6-6 6M21 5v14' },
        { label: '반복 가감속', icon: 'M2 12c3-7 5-7 7 0s4 7 6 0 4-7 7 0' },
        { label: '커브', icon: 'M5 21c0-8 2-10 7-11s7-3 7-7' },
        { label: '차량 내부 환경', icon: 'M14 14.5V5a2 2 0 1 0-4 0v9.5a4 4 0 1 0 4 0zM12 9v8' },
        { label: '잘 모르겠어요', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1 1-1.1 1.8M12 16.5h.01' },
      ].map((c) => {
        const on = this.state.cause === c.label;
        return { ...c, ...paint(on), pressed: String(on), pick: () => this.setState({ cause: on ? '' : c.label }) };
      }),
    };
  }
}
</script>
</body>
</html>
