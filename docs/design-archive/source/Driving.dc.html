<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메인 · 주행 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07111E}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1280px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; background: #07111E; color: #F3EFE9; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 72px; flex: none">
    <div style="display: flex; align-items: center; gap: 20px">
      <span style="font-size: 40px; font-weight: 800; letter-spacing: -0.01em">모션케어</span>
      <span style="display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; padding: 8px 16px; background: #00AAD2; color: #04121F; border-radius: 4px">
        <span aria-hidden="true" style="width: 14px; height: 14px; background: #04121F; border-radius: 50%"></span>운행 기록 중
      </span>
    </div>
    <span style="font-size: 20px; font-weight: 600; padding: 6px 14px; border: 2px solid #8A6A52; border-radius: 4px; color: #E4DCD3">합성 데이터로 시연 중</span>
  </header>

  <sc-if value="{{showBanner}}" hint-placeholder-val="{{ true }}">
    <div role="status" style="display: flex; align-items: center; gap: 20px; margin-top: 24px; height: 104px; flex: none; box-sizing: border-box; padding: 0 32px; background: #E4DCD3; color: #07111E; border-radius: 6px">
      <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 8h16c0-2-2-3-2-8a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"></path></svg>
      <span style="font-size: 32px; font-weight: 800">{{bannerText}}</span>
    </div>
  </sc-if>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 56px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 32px; font-weight: 700; color: #B9C4D2">경과 시간</span>
      <span style="font-size: 280px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">24<span style="font-size: 96px; font-weight: 700; letter-spacing: 0; margin-left: 12px">분</span></span>
    </div>
    <div aria-hidden="true" style="display: flex; gap: 4px; height: 6px">
      <div style="width: 180px; background: #00AAD2"></div>
      <div style="flex: 1; background: #24405F"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 26px; color: #93A3B5">{{s.label}}</span>
          <span style="font-size: 56px; font-weight: 800; white-space: nowrap">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
  </main>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; flex: none">
    <span style="font-size: 26px; color: #B9C4D2">민준 운전 · 서아 동승 · 중형 전기차</span>
    <button type="button" onClick="{{askEnd}}" style="width: 420px; height: 112px; border: 3px solid #E4DCD3; border-radius: 6px; background: transparent; color: #F3EFE9; font: inherit; font-size: 36px; font-weight: 800; cursor: pointer">운행 종료</button>
  </div>

  <sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(3, 9, 16, 0.78)">
      <div role="dialog" aria-label="운행 종료 확인" style="width: 880px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; gap: 40px; background: #132842; border-radius: 8px">
        <h2 style="margin: 0; font-size: 48px; font-weight: 800">이번 운행을 종료할까요?</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
          <button type="button" onClick="{{cancelEnd}}" style="height: 112px; border: 3px solid #3A5C82; border-radius: 6px; background: transparent; color: #F3EFE9; font: inherit; font-size: 32px; font-weight: 700; cursor: pointer">계속 기록</button>
          <a href="Finished.dc.html" style="display: flex; align-items: center; justify-content: center; height: 112px; box-sizing: border-box; border-radius: 6px; background: #00AAD2; color: #04121F; font-size: 32px; font-weight: 800">종료</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bannerKind":{"editor":"enum","options":["환경","장시간 주행","운전 패턴","없음"],"default":"환경","section":"주행 중 안내"},"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { confirming: false };
  renderVals() {
    const kind = this.props.bannerKind ?? '환경';
    const texts = {
      '환경': '외부 대기질이 나빠졌어요. 내기 순환을 확인해보세요',
      '장시간 주행': '1시간째 운전 중이에요. 쉬어갈 곳을 미리 정해보세요',
      '운전 패턴': '정차 직전 속도 변화가 반복되고 있어요',
    };
    return {
      showBanner: kind !== '없음',
      bannerText: texts[kind] ?? '',
      confirming: this.state.confirming,
      askEnd: () => this.setState({ confirming: true }),
      cancelEnd: () => this.setState({ confirming: false }),
      stats: [
        { label: '이동 거리', value: '12.6 km' },
        { label: '외부 대기질', value: '나쁨' },
        { label: '실내 온도', value: '23.5°C' },
      ],
    };
  }
}
</script>
</body>
</html>
