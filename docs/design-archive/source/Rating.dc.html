<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동승자 평가</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07111E}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1600px; height: 1280px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: #07111E; color: #F3EFE9; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums">

  <header style="display: flex; align-items: center; gap: 16px; flex: none">
    <a href="TripDetail.dc.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; flex: none; border-radius: 6px; background: #0D1C2F">
      <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 40px; font-weight: 800">동승자 평가</h1>
      <span style="font-size: 24px; color: #B9C4D2">11월 2일 08:12 출발 · 민준 운전</span>
    </div>
  </header>

  <div role="group" aria-label="평가 대상" style="display: flex; gap: 12px; flex: none">
    <sc-for list="{{targets}}" as="t" hint-placeholder-count="2">
      <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 16px; height: 96px; box-sizing: border-box; padding: 0 28px 0 16px; border: 3px solid {{t.border}}; border-radius: 6px; background: {{t.bg}}; color: #F3EFE9; font: inherit; cursor: pointer">
        <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 6px; background: #132842; font-size: 28px; font-weight: 800; color: #E4DCD3">{{t.mark}}</span>
        <span style="font-size: 30px; font-weight: 700">{{t.name}}</span>
        <span style="font-size: 22px; color: #B9C4D2">{{t.state}}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 860px 636px; gap: 24px">
    <section style="display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; padding: 40px; background: #002C5F; border-radius: 6px; min-height: 0">
      <h2 style="margin: 0 0 8px; font-size: 48px; line-height: 1.25; font-weight: 800">서아의 이번 이동은 어땠나요?</h2>
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; height: 128px; flex: none; box-sizing: border-box; padding: 0 36px; border: 3px solid {{o.border}}; border-radius: 6px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 36px; font-weight: 800; cursor: pointer">
          {{o.label}}
          <sc-if value="{{o.selected}}" hint-placeholder-val="{{ false }}">
            <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"><path d="M4 12l6 6L20 6"></path></svg>
          </sc-if>
        </button>
      </sc-for>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 24px; color: #B9C4D2">누가 답하고 있나요?</span>
        <div role="group" aria-label="응답자" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <button type="button" aria-pressed="true" style="height: 88px; border: 3px solid #E4DCD3; border-radius: 6px; background: transparent; color: #F3EFE9; font: inherit; font-size: 28px; font-weight: 700; cursor: pointer">서아 본인</button>
          <button type="button" aria-pressed="false" style="height: 88px; border: 3px solid #2F5A8C; border-radius: 6px; background: transparent; color: #D5DCE5; font: inherit; font-size: 28px; font-weight: 600; cursor: pointer">다른 사람이 대신</button>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; padding: 36px; background: #0D1C2F; border-radius: 6px; min-height: 0">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 32px; font-weight: 800">무엇이 가장 불편했나요?</h2>
        <span style="font-size: 22px; color: #93A3B5">선택</span>
      </div>
      <div role="group" aria-label="불편 항목" style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{causes}}" as="c" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="display: flex; align-items: center; height: 80px; flex: none; box-sizing: border-box; padding: 0 24px; border: 2px solid {{c.border}}; border-radius: 6px; background: {{c.bg}}; color: #F3EFE9; font: inherit; font-size: 28px; font-weight: 600; text-align: left; cursor: pointer">{{c.label}}</button>
        </sc-for>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 80px; flex: none; margin-top: auto; border: 2px solid #3A5C82; border-radius: 6px; background: transparent; color: #D5DCE5; font: inherit; font-size: 26px; font-weight: 600; cursor: pointer">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        음성으로 남기기
      </button>
    </section>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 16px; flex: none">
    <a href="TripDetail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 112px; box-sizing: border-box; border: 3px solid #3A5C82; border-radius: 6px; font-size: 30px; font-weight: 700; color: #D5DCE5">건너뛰기</a>
    <a href="TripDetail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 112px; border-radius: 6px; background: #00AAD2; color: #04121F; font-size: 36px; font-weight: 800">저장</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1280}}'>
class Component extends DCLogic {
  state = { rating: '조금 불편했어요', cause: '출발·정차', target: 'seoa' };
  renderVals() {
    const ratings = ['편안했어요', '조금 불편했어요', '많이 불편했어요'];
    const causes = ['출발·정차', '반복 가감속', '커브', '차량 내부 환경', '잘 모르겠어요'];
    return {
      targets: [
        { id: 'seoa', name: '서아', mark: '서', state: '작성 중' },
        { id: 'doyun', name: '도윤', mark: '도', state: '미응답' },
      ].map((t) => {
        const on = this.state.target === t.id;
        return { ...t, pressed: String(on), pick: () => this.setState({ target: t.id }), border: on ? '#00AAD2' : '#24405F', bg: on ? '#002C5F' : '#0D1C2F' };
      }),
      options: ratings.map((label) => {
        const selected = this.state.rating === label;
        return { label, selected, pressed: String(selected), pick: () => this.setState({ rating: label }), border: selected ? '#00AAD2' : '#2F5A8C', bg: selected ? '#00AAD2' : 'transparent', fg: selected ? '#04121F' : '#F3EFE9' };
      }),
      causes: causes.map((label) => {
        const on = this.state.cause === label;
        return { label, pressed: String(on), pick: () => this.setState({ cause: on ? '' : label }), border: on ? '#00AAD2' : '#24405F', bg: on ? '#002C5F' : 'transparent' };
      }),
    };
  }
}
</script>
</body>
</html>
